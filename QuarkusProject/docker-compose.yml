version: '3.8'
services:
  # --- ELASTICSEARCH (Arama Motoru) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: veri-projesi-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - veri-net

  # --- KIBANA (Elasticsearch Arayüzü) ---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: veri-projesi-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - veri-net
    depends_on:
      - elasticsearch
  # ClickHouse Veritabanı
  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: veri-projesi-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # Apache NiFi
  nifi:
    image: apache/nifi:latest
    container_name: veri-projesi-nifi
    ports:
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8443
    networks:
      - veri-net

networks:
    veri-net:
      driver: bridge

volumes:
  nifi_conf:
  clickhouse_data:
  clickhouse_log:
  elastic_data: